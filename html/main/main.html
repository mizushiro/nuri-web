<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 예보 - 메인</title>

  <link rel="stylesheet" href="../../resources/cdn/krds.min.css">
  <link rel="stylesheet" href="../../resources/css/plugin/swiper-bundle.min.css">
  <link rel="stylesheet" href="../../resources/css/custom.css">
  <link rel="stylesheet" href="../../resources/css/icon.css">
</head>

<body>
  <div>
    <!-- header -->
    <header id="krds-header"></header>
    <!-- //header -->

    <main class="krds-main">
      <section class="krds-main--sec" data-bg="gray">
        <div class="krds-main--wrap">
          1
        </div>
      </section>
      <section class="krds-main--sec">
        <div class="krds-main--wrap">
          <h3>일별 예보</h3>
          <!-- 스와이퍼 콘텐츠 -->
          <div class="weather-swiper-container">
            <div class="swiper weather-swiper">
              <div class="swiper-wrapper">
                <!-- 데이터 json 형식으로 받아올 예정 -->
              </div>
            </div>
            <!-- 좌우 이동 버튼 (클릭 시 1개씩 이동) -->
            <button type="button" class="weather-swiper-prev swiper-button-prev" aria-label="이전 일기예보"></button>
            <button type="button" class="weather-swiper-next swiper-button-next" aria-label="다음 일기예보"></button>
          </div>

          <!-- 콜백 실행 시 선택 정보 출력 영역 -->
          <div class="selected-weather-info">
            <span class="info-title">📌 선택된 날씨 예보:</span>
            <span id="selected-info-detail" class="info-detail">오늘(05.22) - 오전 20°C (강수 0%) / 오후 26°C (강수 40%)</span>
          </div>

          <!-- 시간별 예보 -->
          <div id="hourly-forecast-sec">
          <div class="hourly-forecast-container">
            <!-- Toolbar Header -->
            <div class="hourly-toolbar">
              <div class="hourly-toolbar-left">
                <h3 class="hourly-title">시간별 예보</h3>
                <div class="hourly-interval-group">
                  <button type="button" class="hourly-interval-btn" data-interval="3">3시간 간격</button>
                  <button type="button" class="hourly-interval-btn active" data-interval="1">1시간 간격</button>
                </div>
              </div>
              <div class="hourly-toolbar-right">
                <button type="button" class="hourly-info-btn">시계열예보안내</button>
                <button type="button" class="hourly-info-btn">최근발표시각</button>
                <button type="button" class="hourly-info-btn">날씨기호 설명</button>
                <!-- View Mode Switcher -->
                <div class="hourly-view-switcher">
                  <button type="button" class="hourly-view-btn active" data-view="mode1" aria-label="선형 차트 보기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
                  </button>
                  <button type="button" class="hourly-view-btn" data-view="mode2" aria-label="막대 차트 보기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="8" width="4" height="12"/><rect x="17" y="4" width="4" height="16"/></svg>
                  </button>
                  <button type="button" class="hourly-view-btn" data-view="mode3" aria-label="리스트 보기">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Content Container (Rendered dynamically) -->
            <div id="hourly-forecast-content"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 기본 셋팅  -->
  <script src="../../resources/cdn/krds.min.js"></script>
  <script src="../../resources/js/plugin/swiper-bundle.min.js"></script>
  <script type="module">
    import { UX } from '../../resources/js/ui-common.js';
    UX.init();

    // Swiper 초기화 함수 및 데이터 바인딩
    const weatherSwiperExe = (data) => {
      // JSON 데이터를 Swiper 슬라이드 HTML 문자열로 생성하는 함수
      const weatherSlideMaker = (dataList) => {
        let result = '';
        dataList.forEach(item => {
          result += `
            <div class="swiper-slide weather-card ${item.active ? 'active' : ''}" data-date="${item.date}" data-day="${item.day}" data-am-temp="${item.amTemp}" data-am-rain="${item.amRain}" data-pm-temp="${item.pmTemp}" data-pm-rain="${item.pmRain}">
              <div class="card-header">
                <strong class="day">${item.day}</strong>
                <span class="date">${item.date}</span>
              </div>
              <div class="card-body">
                <div class="time-col am">
                  <div class="weather-icon">
                    <div data-icon-weather="${item.amIcon}">
                      <span class="sr-only">${item.amText}</span>
                    </div>
                  </div>
                  <span class="temp am">${item.amTemp}</span>
                  <span class="rain">${item.amRain}</span>
                </div>
                <div class="time-col pm">
                  <div class="weather-icon">
                    <div data-icon-weather="${item.pmIcon}">
                      <span class="sr-only">${item.pmText}</span>
                    </div>
                  </div>
                  <span class="temp pm">${item.pmTemp}</span>
                  <span class="rain">${item.pmRain}</span>
                </div>
              </div>
            </div>
          `;
        });
        return result;
      };

      // HTML 슬라이드 노드 추가
      const wrapper = document.querySelector('.weather-swiper .swiper-wrapper');
      if (wrapper) {
        wrapper.innerHTML = weatherSlideMaker(data);
      }

      // Swiper 인스턴스 생성 (한 화면에 6개 노출)
      const weatherSwiper = new Swiper('.weather-swiper', {
        slidesPerView: 6,
        slidesPerGroup: 1, // 버튼 클릭 시 하나씩 이동
        spaceBetween: 12,
        navigation: {
          nextEl: '.weather-swiper-next',
          prevEl: '.weather-swiper-prev',
        },
        breakpoints: {
          320: { slidesPerView: 2, spaceBetween: 8 },
          640: { slidesPerView: 3, spaceBetween: 10 },
          768: { slidesPerView: 4, spaceBetween: 12 },
          1024: { slidesPerView: 6, spaceBetween: 12 }
        }
      });

      /**
       * 날씨 카드 클릭 시 실행되는 콜백 함수
       * @param {Object} cardData - 클릭한 카드의 날씨 정보
       * @param {HTMLElement} element - 클릭한 카드의 DOM 엘리먼트
       */
      function onWeatherCardClick(cardData, element) {
        console.log('[콜백 실행] 선택한 날씨 정보:', cardData);

        // 하단 안내 영역 업데이트
        const infoDetail = document.getElementById('selected-info-detail');
        if (infoDetail) {
          infoDetail.textContent = `${cardData.day}(${cardData.date}) - 오전 ${cardData.amTemp} (강수 ${cardData.amRain}) / 오후 ${cardData.pmTemp} (강수 ${cardData.pmRain})`;
        }

        // 선택한 날짜로 시간별 예보 스크롤 이동
        scrollToHourlyDate(cardData.date);

        // 커스텀 이벤트 전달 (필요 시 외부 연동용)
        element.dispatchEvent(new CustomEvent('weatherSelect', { detail: cardData, bubbles: true }));
      }

      // 카드 클릭 이벤트 및 콜백 바인딩
      const weatherCards = document.querySelectorAll('.weather-card');
      weatherCards.forEach((card) => {
        card.addEventListener('click', function () {
          // 활성 클래스 변경
          weatherCards.forEach(c => c.classList.remove('active'));
          this.classList.add('active');

          // 데이터 수집
          const cardData = {
            day: this.dataset.day,
            date: this.dataset.date,
            amTemp: this.dataset.amTemp,
            amRain: this.dataset.amRain,
            pmTemp: this.dataset.pmTemp,
            pmRain: this.dataset.pmRain
          };

          // 콜백 함수 실행
          onWeatherCardClick(cardData, this);
        });
      });
    };

    /**
     * 일별 예보 카드 클릭 시 시간별 예보의 해당 날짜 위치로 스크롤 이동하는 함수
     * @param {string} targetDate - 선택한 날짜 (예: '05.24')
     */
    const scrollToHourlyDate = (targetDate) => {
      if (!targetDate) return;

      // Mode 1 & Mode 2: 가로 스크롤 뷰포트 이동
      const viewport = document.querySelector('.hourly-scroll-viewport');
      if (viewport) {
        const dateGroup = viewport.querySelector(`.date-group[data-date="${targetDate}"]`);
        if (dateGroup) {
          viewport.scrollTo({
            left: dateGroup.offsetLeft,
            behavior: 'smooth'
          });
        }
      }

      // Mode 3: 리스트 모드 블록 이동
      const listBlock = document.querySelector(`.list-date-block[data-date="${targetDate}"]`);
      if (listBlock) {
        listBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    };

    /**
     * 시간별 예보 컴포넌트 실행 함수
     * @param {Array} data - weather.json 데이터
     */
    const hourlyForecastExe = (data) => {
      let currentInterval = 1; // 1: 1시간 간격, 3: 3시간 간격
      let currentViewMode = 'mode1'; // mode1: 선형 차트, mode2: 막대 차트, mode3: 리스트

      const getWindArrow = (dir) => {
        const arrows = {
          'N': '▲', 'NE': '↗', 'E': '▶', 'SE': '↘',
          'S': '▼', 'SW': '↙', 'W': '◀', 'NW': '↖'
        };
        return arrows[dir] || '▲';
      };

      const filterHours = (hours, interval) => {
        if (!hours) return [];
        if (interval === 1) return hours;
        // 3시간 간격 필터링 (03시, 06시, 09시, 12시, 15시, 18시, 21시, 00시 등)
        return hours.filter(h => {
          const num = parseInt(h.time);
          return num % 3 === 0;
        });
      };

      const renderComponent = () => {
        const container = document.getElementById('hourly-forecast-content');
        if (!container) return;

        // hourly 데이터가 존재하는 날짜 항목만 사용
        const validDates = data.filter(d => d.hourly && d.hourly.length > 0);

        if (currentViewMode === 'mode3') {
          // Mode 3: 리스트 형태
          let html = '<div class="hourly-list-container">';
          validDates.forEach(dayItem => {
            const hours = filterHours(dayItem.hourly, currentInterval);
            html += `
              <div class="list-date-block" data-date="${dayItem.date}">
                <div class="list-date-header">
                  <span class="badge-type">${dayItem.forecastType || '단기예보'}</span>
                  <span class="date-pill">📅 ${dayItem.date} (${dayItem.dayOfWeek || dayItem.day})</span>
                  <span class="temp-range">최저 <span class="min-temp">${dayItem.minTemp || '-'}</span> <span class="divider">|</span> 최고 <span class="max-temp">${dayItem.maxTemp || '-'}</span></span>
                </div>
                <table class="hourly-list-table">
                  <thead>
                    <tr>
                      <th>시각</th>
                      <th>날씨</th>
                      <th>기온(체감)</th>
                      <th>강수량</th>
                      <th>강수강도</th>
                      <th>강수확률</th>
                      <th>바람</th>
                      <th>습도</th>
                      <th>폭염영향</th>
                    </tr>
                  </thead>
                  <tbody>
            `;
            hours.forEach(h => {
              html += `
                <tr>
                  <td>${h.time}</td>
                  <td>
                    <div class="td-weather">
                      <div data-icon-weather="${h.icon}"></div>
                      <span>${h.text}</span>
                    </div>
                  </td>
                  <td><strong>${h.temp}</strong> <span style="color:#777; font-size:1.2rem;">(${h.sensoryTemp})</span></td>
                  <td>${h.precip || '-'}</td>
                  <td>${h.precipIntensity || '-'}</td>
                  <td>${h.rainProb || '0%'}</td>
                  <td>${h.windText || '-'}</td>
                  <td>${h.humidity || '-'}</td>
                  <td>${h.heatImpact || '-'}</td>
                </tr>
              `;
            });
            html += `
                  </tbody>
                </table>
              </div>
            `;
          });
          html += '</div>';
          container.innerHTML = html;
          return;
        }

        // Mode 1 (선형 차트) 및 Mode 2 (막대 차트)
        const isBarChartMode = (currentViewMode === 'mode2');

        let fixedColHtml = `
          <div class="hourly-fixed-column">
            <div class="fixed-header-cell"><span class="info-icon">i</span></div>
            <div class="fixed-row-cell row-time">시각</div>
            <div class="fixed-row-cell row-weather">날씨</div>
            <div class="fixed-row-cell row-temp-chart">기온</div>
            <div class="fixed-row-cell row-sensory">체감온도</div>
            <div class="fixed-row-cell row-precip">강수량(mm)</div>
            <div class="fixed-row-cell row-rain-prob ${isBarChartMode ? 'has-bar-chart' : ''}">강수확률</div>
            <div class="fixed-row-cell row-wind">바람(m/s)</div>
            <div class="fixed-row-cell row-humidity">습도</div>
            <div class="fixed-row-cell row-heat">폭염영향</div>
          </div>
        `;

        let scrollViewportHtml = `
          <div class="hourly-scroll-viewport">
            <div class="hourly-dates-wrapper">
        `;

        validDates.forEach(dayItem => {
          const hours = filterHours(dayItem.hourly, currentInterval);
          scrollViewportHtml += `
            <div class="date-group" data-date="${dayItem.date}">
              <div class="date-sticky-header">
                <span class="badge-type">${dayItem.forecastType || '단기예보'}</span>
                <span class="date-pill">📅 ${dayItem.date} (${dayItem.dayOfWeek || dayItem.day})</span>
                <span class="temp-range">최저 <span class="min-temp">${dayItem.minTemp || '-'}</span> <span class="divider">|</span> 최고 <span class="max-temp">${dayItem.maxTemp || '-'}</span></span>
              </div>
              <div class="hourly-columns-row">
          `;

          hours.forEach(h => {
            const rainPercent = parseInt(h.rainProb) || 0;
            const barHeightPx = Math.max(4, Math.round(rainPercent * 0.6));

            scrollViewportHtml += `
              <div class="hourly-col">
                <div class="cell row-time cell-time">${h.time}</div>
                <div class="cell row-weather cell-weather">
                  <div data-icon-weather="${h.icon}">
                    <span class="sr-only">${h.text}</span>
                  </div>
                </div>
                <div class="cell row-temp-chart cell-temp-chart">
                  <span class="chart-temp-val">${h.temp}</span>
                  <span class="chart-dot"></span>
                </div>
                <div class="cell row-sensory cell-sensory">${h.sensoryTemp}</div>
                <div class="cell row-precip cell-precip">${h.precip}</div>
                <div class="cell row-rain-prob cell-rain-prob ${isBarChartMode ? 'cell-rain-bar-chart has-bar-chart' : ''}">
                  ${isBarChartMode ? `
                    <span class="bar-val">${h.rainProb}</span>
                    <div class="bar-fill" style="height: ${barHeightPx}px;"></div>
                  ` : `${h.rainProb}`}
                </div>
                <div class="cell row-wind cell-wind">
                  <span class="wind-arrow">${getWindArrow(h.windDir)}</span>
                  <span class="wind-text">${h.windSpeed || '6'}</span>
                </div>
                <div class="cell row-humidity cell-humidity">${h.humidity}</div>
                <div class="cell row-heat cell-heat">${h.heatImpact || '-'}</div>
              </div>
            `;
          });

          scrollViewportHtml += `
              </div>
            </div>
          `;
        });

        scrollViewportHtml += `
            </div>
          </div>
        `;

        container.innerHTML = `
          <div class="hourly-grid-container">
            ${fixedColHtml}
            ${scrollViewportHtml}
          </div>
        `;

        // 드래그 스크롤 이벤트 바인딩
        bindDragScroll();
      };

      // 마우스 드래그 스크롤 바인딩 함수
      const bindDragScroll = () => {
        const slider = document.querySelector('.hourly-scroll-viewport');
        if (!slider) return;

        let isDown = false;
        let startX = 0;
        let scrollLeft = 0;

        slider.addEventListener('mousedown', (e) => {
          isDown = true;
          slider.classList.add('grabbing');
          startX = e.pageX - slider.offsetLeft;
          scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('mouseleave', () => {
          isDown = false;
          slider.classList.remove('grabbing');
        });

        slider.addEventListener('mouseup', () => {
          isDown = false;
          slider.classList.remove('grabbing');
        });

        slider.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - slider.offsetLeft;
          const walk = (x - startX) * 1.5;
          slider.scrollLeft = scrollLeft - walk;
        });
      };

      // 초기 렌더링
      renderComponent();

      // 간격 버튼 이벤트 바인딩
      const intervalBtns = document.querySelectorAll('.hourly-interval-btn');
      intervalBtns.forEach(btn => {
        btn.addEventListener('click', function () {
          intervalBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentInterval = parseInt(this.dataset.interval);
          renderComponent();
        });
      });

      // 뷰 모드 버튼 이벤트 바인딩
      const viewBtns = document.querySelectorAll('.hourly-view-btn');
      viewBtns.forEach(btn => {
        btn.addEventListener('click', function () {
          viewBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentViewMode = this.dataset.view;
          renderComponent();
        });
      });
    };

    // 로컬 fallback용 데이터
    const fallbackData = [
      {
        day: "오늘", date: "05.22", dayOfWeek: "수", forecastType: "단기예보", minTemp: "18°C", maxTemp: "26°C",
        amIcon: "NB01", amText: "맑음", amTemp: "20°C", amRain: "0%", pmIcon: "NB02", pmText: "구름조금", pmTemp: "26°C", pmRain: "40%", active: true,
        hourly: [
          { time: "01시", icon: "NB01", text: "맑음", temp: "19°C", sensoryTemp: "20°C", precip: "-", precipIntensity: "-", rainProb: "0%", windDir: "N", windSpeed: "2", windText: "북풍 2m/s", humidity: "65%", heatImpact: "-" },
          { time: "02시", icon: "NB01", text: "맑음", temp: "18°C", sensoryTemp: "19°C", precip: "-", precipIntensity: "-", rainProb: "0%", windDir: "N", windSpeed: "2", windText: "북풍 2m/s", humidity: "68%", heatImpact: "-" },
          { time: "03시", icon: "NB01", text: "맑음", temp: "18°C", sensoryTemp: "18°C", precip: "-", precipIntensity: "-", rainProb: "0%", windDir: "NE", windSpeed: "1", windText: "북동 1m/s", humidity: "70%", heatImpact: "-" },
          { time: "06시", icon: "NB01", text: "맑음", temp: "20°C", sensoryTemp: "20°C", precip: "-", precipIntensity: "-", rainProb: "0%", windDir: "E", windSpeed: "2", windText: "동풍 2m/s", humidity: "65%", heatImpact: "-" },
          { time: "09시", icon: "NB01", text: "맑음", temp: "24°C", sensoryTemp: "25°C", precip: "-", precipIntensity: "-", rainProb: "10%", windDir: "S", windSpeed: "3", windText: "남풍 3m/s", humidity: "50%", heatImpact: "-" },
          { time: "12시", icon: "NB02", text: "구름조금", temp: "26°C", sensoryTemp: "27°C", precip: "-", precipIntensity: "-", rainProb: "30%", windDir: "SW", windSpeed: "4", windText: "남서 4m/s", humidity: "45%", heatImpact: "-" },
          { time: "15시", icon: "NB02", text: "구름조금", temp: "25°C", sensoryTemp: "26°C", precip: "-", precipIntensity: "-", rainProb: "40%", windDir: "NW", windSpeed: "3", windText: "북서 3m/s", humidity: "50%", heatImpact: "-" },
          { time: "18시", icon: "NB01", text: "맑음", temp: "22°C", sensoryTemp: "23°C", precip: "-", precipIntensity: "-", rainProb: "10%", windDir: "N", windSpeed: "2", windText: "북풍 2m/s", humidity: "58%", heatImpact: "-" },
          { time: "21시", icon: "NB01", text: "맑음", temp: "20°C", sensoryTemp: "20°C", precip: "-", precipIntensity: "-", rainProb: "0%", windDir: "N", windSpeed: "1", windText: "북풍 1m/s", humidity: "65%", heatImpact: "-" },
          { time: "00시", icon: "NB01", text: "맑음", temp: "18°C", sensoryTemp: "18°C", precip: "-", precipIntensity: "-", rainProb: "0%", windDir: "N", windSpeed: "1", windText: "북풍 1m/s", humidity: "72%", heatImpact: "-" }
        ]
      }
    ];

    // weather.json 데이터 패치 후 실행
    fetch('./weather.json')
      .then(res => res.json())
      .then(data => {
        weatherSwiperExe(data);
        hourlyForecastExe(data);
      })
