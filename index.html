<body>
  <div>
    <!-- header -->
    <header id="krds-header"></header>
    <!-- //header -->

    <main class="krds-main">
      <section class="krds-main--sec" data-bg="gray">
        <div class="krds-main--wrap">
          1
        </div>
      </section>
      <section class="krds-main--sec">
        <div class="krds-main--wrap">
          <div class="krds-main--group">
            <div class="krds-main--head">
              <h3 class="krds-main--title">일별 예보</h3>
            </div>

            <!-- 스와이퍼 콘텐츠 -->
            <div class="weather-swiper-container">
              <div class="swiper weather-swiper">
                <div class="swiper-wrapper">
                  <!-- 데이터 json 형식으로 받아올 예정 -->
                </div>
              </div>
              <!-- 좌우 이동 버튼 (클릭 시 1개씩 이동) -->
              <button type="button" class="weather-swiper-prev swiper-button-prev" aria-label="이전 일기예보"></button>
              <button type="button" class="weather-swiper-next swiper-button-next" aria-label="다음 일기예보"></button>
            </div>
          </div>
          <!-- 시간별 예보 -->
          <div class="krds-main--group" id="hourly-forecast-sec">
            <div class="krds-main--head">
              <div class="krds-main--head-item" data-gap="3">
                <h3 class="krds-main--title">시간별 예보</h3>
                <div class="hourly-interval-group">
                    <button type="button" class="hourly-interval-btn" data-interval="3">3시간 간격</button>
                    <button type="button" class="hourly-interval-btn active" data-interval="1">1시간 간격</button>
                  </div>
              </div>

              <div class="krds-main--head-item" data-gap="3">
                <div class="krds-main--head-item">
                  <button type="button" class="hourly-info-btn">시계열예보안내</button>
                  <button type="button" class="hourly-info-btn">최근발표시각</button>
                  <button type="button" class="hourly-info-btn">날씨기호 설명</button>
                </div>

                <div class="krds-main--head-line"></div>

                <!-- View Mode Switcher -->
                <div class="hourly-view-switcher">
                  <button type="button" class="hourly-view-btn active" data-view="mode1" aria-label="선형 차트 보기" >
                    <span data-icon="legend-1"></span>
                  </button>
                  <button type="button" class="hourly-view-btn" data-view="mode2" aria-label="막대 차트 보기">
                    <span data-icon="legend-2"></span>
                  </button>
                  <button type="button" class="hourly-view-btn" data-view="mode3" aria-label="리스트 보기">
                    <span data-icon="legend-3"></span>
                  </button>
                </div>
              </div>

            </div>
            <div class="hourly-forecast-container">
              <!-- Content Container (Rendered dynamically) -->
              <div id="hourly-forecast-content"></div>
            </div>
        </div>
      </section>
      <section class="krds-main--sec" data-bg="gray">
        <div class="krds-main--wrap">
          3
        </div>
      </section>
    </main>
